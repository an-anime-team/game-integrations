[download_files_patches_title]
en = "Download update files"
ru = "Загрузка файлов обновления"

[patch_update_files_title]
en = "Update game files"
ru = "Обновление файлов игры"

[verify_updated_files_title]
en = "Verify updated files"
ru = "Проверка обновлённых файлов"

[repair_files_title]
en = "Repair game files"
ru = "Исправление файлов игры"
